services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    container_name: agents_db_postgres
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: agents_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d agents_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # --- Shared MongoDB Database ---
  mongo:
    image: mongo:latest
    container_name: shared_mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: always

  # --- Node.js TypeScript User Microservice ---
  user-service:
    build: ./user-service
    container_name: users_service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/users_db
      - JWT_SECRET=super_secret_key_2026
    depends_on:
      - mongo
    restart: always

  # --- Node.js TypeScript Room Microservice ---
  room-service:
    build: ./room-service
    container_name: rooms_service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongo:27017/rooms_db
    depends_on:
      - mongo
    restart: always

  # --- Node.js TypeScript Chat & Real-time Microservice ---
  chat-service:
    build: ./chat-service
    container_name: chats_service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongo:27017/chats_db
    depends_on:
      - mongo
    restart: always

  # --- FastAPI Agent Microservice ---
  agent-service:
    build: ./agent-service
    container_name: agents_service
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Agents Service
      - DEBUG=True
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg2://postgres_user:postgres_password@db:5432/agents_db
    depends_on:
      - db
    restart: always

  # --- API Gateway (Cổng giao tiếp duy nhất cho Client) ---
  api-gateway:
    build: ./gateway-service
    container_name: api_gateway_service
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - USER_SERVICE_URL=http://user-service:5001
      - ROOM_SERVICE_URL=http://room-service:5002
      - CHAT_SERVICE_URL=http://chat-service:5003
      - AGENT_SERVICE_URL=http://agent-service:8000
    depends_on:
      - user-service
      - room-service
      - chat-service
      - agent-service
    restart: always

volumes:
  postgres_data:
  mongo_data:
