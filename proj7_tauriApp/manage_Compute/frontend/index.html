<!doctype html>
<html lang="en" style="background-color: #09090b;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compute Studio Workbench</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body, html {
        background-color: #09090b;
        color: #e4e4e7;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        height: 100%;
        overflow: hidden;
      }
      .app-preloader {
        position: fixed;
        inset: 0;
        background-color: #09090b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
      }
      .loader-logo {
        width: 44px;
        height: 44px;
        color: #10b981;
        margin-bottom: 16px;
        animation: pulseLogo 1.8s infinite ease-in-out;
      }
      .loader-bar-bg {
        width: 200px;
        height: 3px;
        background-color: #18181b;
        border-radius: 9999px;
        overflow: hidden;
        border: 1px solid #27272a;
        margin-top: 14px;
        position: relative;
      }
      .loader-bar-fill {
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #10b981, #34d399);
        border-radius: 9999px;
        position: absolute;
        animation: slideLoader 1.4s infinite ease-in-out;
      }
      @keyframes pulseLogo {
        0%, 100% { opacity: 0.5; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes slideLoader {
        0% { left: -40%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body style="background-color: #09090b;">
    <div id="root">
      <div class="app-preloader">
        <svg class="loader-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"></rect>
          <path d="M7 7h.01"></path>
          <path d="M17 7h.01"></path>
          <path d="M7 17h.01"></path>
          <path d="M17 17h.01"></path>
          <path d="M7 12h10"></path>
        </svg>
        <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.5px; color: #f4f4f5;">Compute Studio</div>
        <div style="font-size: 11px; color: #71717a; margin-top: 4px;">Initializing Local Compute Engine...</div>
        <div class="loader-bar-bg">
          <div class="loader-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
