version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ai_redis_memory
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai_qdrant_memory
    ports:
      - "6333:6333" # REST API & Web Dashboard: http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "echo > /dev/tcp/127.0.0.1/6333"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  ai-core:
    build: ./ai-core-service
    container_name: ai_core_fastapi
    ports:
      - "${AI_CORE_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_healthy
    volumes:
      - ./ai-core-service:/app
    restart: always
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  gateway:
    build: ./gateway-service
    container_name: ai_gateway_ts
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      - PORT=${GATEWAY_PORT:-4000}
      - AI_CORE_URL=${AI_CORE_URL:-http://ai-core:8000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      ai-core:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  frontend:
    build: ./frontend
    container_name: ai_frontend_react_ts
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      - VITE_GATEWAY_URL=${VITE_GATEWAY_URL:-http://localhost:4000}
    depends_on:
      - gateway
    restart: always

volumes:
  redis_data:
  qdrant_data: